[package]
name = "bluepill-examples"
version = "0.8.0"
authors = ["Johan Kristell <johan@jott.se>"]
publish = false
edition = "2018"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f1xx-hal = { version = "0.11", features = ["rtic", "stm32f103", "medium"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
usb-device = "0.3"
usbd-hid = "0.8"
embedded-hal = "1.0"
cortex-m-rtic = "1"
rtic-monotonic = "1"
heapless = "0.7.10"
infrared = { path = "../..", features = ["defmt"] }

[profile.release]
codegen-units = 1
opt-level = 's'
incremental = false
debug = 2

[profile.dev]
codegen-units = 1
opt-level = 's'
incremental = false
debug = 2
lto = true
