[package]
name = "embassy-rp-pico-examples"
version = "0.1.0"
publish = false
edition = "2024"

[dependencies]
cortex-m-rt = "0.7"

defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-rp = { version = "0.10", features = ["defmt", "time-driver", "critical-section-impl", "rp2040", "executor-thread"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }

infrared = { path = "../..", features = ["embassy", "defmt"] }

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
