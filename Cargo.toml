[package]
name = "infrared"
version = "0.15.0"
authors = ["Johan Kristell <johan@jott.se>"]
edition = "2024"
rust-version = "1.85"
description = "Infrared remote control library"
repository = "https://github.com/jkristell/infrared"
readme = "README.md"
keywords = ["infrared", "remote", "rc5", "rc6", "nec"]
categories = ["no-std", "embedded"]
license = "MIT OR Apache-2.0"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["examples/vcd-parser"]
exclude = ["examples/bluepill", "examples/rp-pico", "examples/embassy-rp-pico", "examples/arduino_uno"]

[features]
default = ["nec", "rc5", "rc6", "sbp", "denon", "remotes", "embedded-hal", "fugit"]
embedded-hal = ["dep:embedded-hal"]
std = []
async = ["embedded-hal", "dep:embedded-hal-async", "dep:embassy-futures"]
embassy = ["async", "dep:embassy-time"]
fugit = ["dep:fugit"]
defmt = ["dep:defmt"]
log = ["dep:log"]
nec = []
rc5 = []
rc6 = []
sbp = []
denon = []
remotes = []

[dependencies]
embedded-hal = { version = "1.0", optional = true }
defmt = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }
fugit = { version = "0.3.5", optional = true }
embedded-hal-async = { version = "1.0", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }

[dev-dependencies]
dummy-pin = "1.0.0"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
